<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>North Star Bakery</title>
        <link rel="stylesheet" href="css/styles.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Redaction+10:ital,wght@0,400;0,700;1,400&display=swap"
            rel="stylesheet"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="js/theme.js"></script>
    </head>
    <body>
        <header>
            <div id="top-bar-container">
                <img
                    height="100"
                    width="100"
                    src="images/bakery-logo_c.png"
                    alt="Logo for north star bakery"
                />
                <button id="theme-switcher">Dark Mode</button>
            </div>
            <h1>Products</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </header>

        <main id="product-list-container">
            <img src="images/bakery-bread_c.png" alt="A few loaves of bread in a bakery case" />
            <div id="product-list">
                <div class="product-section">
                    <h2>Breads</h2>
                    <div>
                        <p>Sourdough: $5</p>
                        <p>White Bread: $10</p>
                        <p>Gold Bread: $100</p>
                    </div>
                </div>

                <div class="product-section">
                    <h2>Pastries</h2>
                    <div>
                        <p>Muffin: $5</p>
                        <p>Croissant: $5</p>
                        <p>Bear Claw: $5</p>
                    </div>
                </div>

                <div class="product-section">
                    <h2>Cakes</h2>
                    <div>
                        <p>Carrot Cake: $20</p>
                        <p>Cheesecake: $30</p>
                        <p>Reed Velvet: $20</p>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>Located at 123 Anytown USA</p>
            <p>Hours of Operation: 6am to 5pm daily</p>
        </footer>
    </body>
</html>
